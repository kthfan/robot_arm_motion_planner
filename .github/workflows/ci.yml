name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # EAIK is built from git (pinned commit); pip caches the built wheel.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Test
        run: pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pinocchio / EAIK / urchin are mocked by docs/conf.py when missing
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy sphinx
          pip install --no-deps -e .

      - name: Build docs (warnings are errors)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
