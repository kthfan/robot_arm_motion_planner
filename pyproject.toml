[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "motion_planner"
dynamic = ["version"]
description = "Kinematics (FK/IK) and Cartesian motion planning (PTP_T, LINE_T) for the Techman TM5S arm."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pin>=3.0",
    # EAIK fork with the robust changes (tip_link, idealization, pos/rot_error);
    # not on PyPI: https://github.com/kthfan/EAIK (requirements.txt installs it
    # from git). urchin is an EAIK dependency.
    "eaik==1.2.2+robust.1",
    "urchin",
]

[project.optional-dependencies]
test = ["pytest>=7.4.0"]
docs = ["sphinx"]

[tool.setuptools.dynamic]
version = {attr = "motion_planner.__version__"}

[tool.setuptools.packages.find]
include = ["motion_planner*"]

[tool.setuptools.package-data]
motion_planner = ["models/*"]
